<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        <div class="scoreboard">
            <div class="player-info">
                <p>Vishal Raj</p>
                <p class="score" id="playerScore">0</p>
            </div>
            <div class="collision-counter">
                <p>Collisions</p>
                <p class="counter" id="collisionCount">0</p>
            </div>
            <div class="player-info">
                <p>Computer</p>
                <p class="score" id="computerScore">0</p>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="instructions">
            <p><strong>Controls:</strong> Use Mouse Y-position or Arrow Keys (↑↓) to move the left paddle</p>
            <p><strong>Objective:</strong> Bounce the ball past the opponent's paddle to score!</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
